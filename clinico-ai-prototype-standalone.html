const riskColor = (r) => (r === "HIGH RISK" ? C.red : r === "WATCH" ? C.amber : C.mint);
const sevColor = (s) => (s === "critical" ? C.red : s === "warning" ? C.amber : C.cyan);
const confColor = (c) => (c >= 80 ? C.mint : c >= 60 ? C.cyan : C.text3);

/* PRIMITIVES */
const Pill = ({ children, color, style }) => (
  <span style={{ fontFamily: mono, fontSize: 11, letterSpacing: 0.4, padding: "3px 9px", borderRadius: 20,
    border: `1px solid ${color}55`, color, background: `${color}14`, whiteSpace: "nowrap", ...style }}>{children}</span>
);

const Card = ({ children, style, onClick, hover }) => {
  const [h, setH] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => hover && setH(true)} onMouseLeave={() => hover && setH(false)}
      style={{ background: C.surface, border: `1px solid ${h ? C.border2 : C.border}`, borderRadius: 10, padding: 16,
        cursor: onClick ? "pointer" : "default", transition: "border-color .15s, transform .15s",
        transform: h ? "translateY(-1px)" : "none", ...style }}>{children}</div>
  );
};

const Btn = ({ children, onClick, variant = "ghost", style, small }) => {
  const base = { fontFamily: sans, fontSize: small ? 12.5 : 13.5, fontWeight: 600, padding: small ? "6px 10px" : "9px 14px",
    borderRadius: 7, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6,
    border: "1px solid transparent", transition: "opacity .15s", whiteSpace: "nowrap" };
  const variants = {
    primary: { background: C.mint, color: "#04140C" },
    secondary: { background: C.surface2, color: C.text, border: `1px solid ${C.border2}` },
    ghost: { background: "transparent", color: C.text2, border: `1px solid ${C.border}` },
    danger: { background: `${C.red}18`, color: C.red, border: `1px solid ${C.red}44` },
  };
  return (
    <button onClick={onClick} onMouseEnter={(e) => (e.currentTarget.style.opacity = 0.85)}
      onMouseLeave={(e) => (e.currentTarget.style.opacity = 1)} style={{ ...base, ...variants[variant], ...style }}>
      {children}
    </button>
  );
};

const ConfBar = ({ value }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
    <div style={{ flex: 1, height: 4, borderRadius: 4, background: C.surface2, overflow: "hidden" }}>
      <div style={{ width: `${value}%`, height: "100%", background: confColor(value), borderRadius: 4 }} />
    </div>
    <span style={{ fontFamily: mono, fontSize: 11, color: confColor(value) }}>{value}%</span>
  </div>
);

const SectionLabel = ({ children }) => (
  <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, letterSpacing: 0.5, marginBottom: 10 }}>{children}</div>
);

/* TOP NAV */
function TopNav({ role, setRole, screen, setScreen, alertCount }) {
  const doctorTabs = [
    { id: "dashboard", label: "Dashboard" },
    { id: "alerts", label: "Alerts", badge: alertCount },
    { id: "chat", label: "AI Chat" },
    { id: "note", label: "Note" },
  ];
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 20px",
      borderBottom: `1px solid ${C.border}`, background: "rgba(10,12,15,0.9)", backdropFilter: "blur(10px)",
      position: "sticky", top: 0, zIndex: 40, flexWrap: "wrap", gap: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
        <div style={{ fontFamily: head, fontWeight: 800, fontSize: 15, color: C.mint, letterSpacing: 1 }}>CLINICO</div>
        {role === "doctor" && (
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            {doctorTabs.map((t) => {
              const active = screen === t.id;
              return (
                <button key={t.id} onClick={() => setScreen(t.id)} style={{ display: "flex", alignItems: "center", gap: 6,
                  padding: "7px 12px", borderRadius: 7, background: active ? C.surface2 : "transparent",
                  border: `1px solid ${active ? C.border2 : "transparent"}`, color: active ? C.text : C.text2,
                  fontFamily: sans, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                  {t.label}
                  {!!t.badge && <span style={{ fontFamily: mono, fontSize: 10, background: C.red, color: "#fff", borderRadius: 20, padding: "0 5px", marginLeft: 2 }}>{t.badge}</span>}
                </button>
              );
            })}
          </div>
        )}
      </div>
      <div style={{ display: "flex", gap: 4, background: C.bg3, padding: 3, borderRadius: 8, border: `1px solid ${C.border}` }}>
        <button onClick={() => setRole("doctor")} style={{ padding: "6px 12px", borderRadius: 6,
          background: role === "doctor" ? C.surface2 : "transparent", color: role === "doctor" ? C.text : C.text3,
          border: "none", fontFamily: sans, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Doctor</button>
        <button onClick={() => setRole("patient")} style={{ padding: "6px 12px", borderRadius: 6,
          background: role === "patient" ? C.surface2 : "transparent", color: role === "patient" ? C.text : C.text3,
          border: "none", fontFamily: sans, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Patient</button>
      </div>
    </div>
  );
}

/* SCREEN 1 — DASHBOARD */
function Dashboard({ patients, selectedId, setSelectedId, openReasoning, setScreen, setChatDraft }) {
  const [tab, setTab] = useState("labs");
  const p = patients.find((x) => x.id === selectedId);
  const [ask, setAsk] = useState("");

  return (
    <div style={{ display: "grid", gridTemplateColumns: "230px 1fr 300px", gap: 1, background: C.border, minHeight: "calc(100vh - 53px)" }}>
      <div style={{ background: C.bg2, padding: 14, overflowY: "auto" }}>
        <SectionLabel>PATIENT QUEUE · {patients.length}</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {patients.map((pt) => {
            const active = pt.id === selectedId;
            return (
              <Card key={pt.id} hover onClick={() => setSelectedId(pt.id)} style={{ padding: 12,
                background: active ? C.surface2 : C.surface, border: `1px solid ${active ? C.mint + "66" : C.border}` }}>
                <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                  <div style={{ width: 32, height: 32, borderRadius: 8, background: C.bg3, color: C.text2,
                    display: "flex", alignItems: "center", justifyContent: "center", fontFamily: mono, fontSize: 11.5, flexShrink: 0 }}>{pt.initials}</div>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontFamily: sans, fontSize: 13.5, fontWeight: 600, color: C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{pt.name}</div>
                    <div style={{ fontFamily: mono, fontSize: 10.5, color: C.text3 }}>{pt.visitType} · {pt.visitTime}</div>
                  </div>
                </div>
                <div style={{ marginTop: 8 }}><Pill color={riskColor(pt.risk)}>{pt.risk}</Pill></div>
              </Card>
            );
          })}
        </div>
      </div>

      <div style={{ background: C.bg2, padding: "20px 24px", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
          <div>
            <div style={{ fontFamily: head, fontSize: 22, fontWeight: 700, color: C.text }}>{p.name}</div>
            <div style={{ fontFamily: mono, fontSize: 12, color: C.text3, marginTop: 4 }}>{p.age}{p.sex} · {p.diagnosis} · {p.visits} prior visits</div>
          </div>
          <Btn variant="primary" small>Start Visit</Btn>
        </div>

        <div style={{ display: "flex", gap: 4, borderBottom: `1px solid ${C.border}`, marginBottom: 18 }}>
          {["labs", "history"].map((t) => (
            <button key={t} onClick={() => setTab(t)} style={{ padding: "8px 4px", marginRight: 20, background: "none",
              border: "none", cursor: "pointer", fontFamily: sans, fontSize: 13, fontWeight: 600,
              color: tab === t ? C.text : C.text3, borderBottom: `2px solid ${tab === t ? C.mint : "transparent"}` }}>
              {t === "labs" ? "Labs" : "History"}
            </button>
          ))}
        </div>

        {tab === "labs" ? (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 20 }}>
              <Card>
                <SectionLabel>LAST BP</SectionLabel>
                <div style={{ fontFamily: head, fontSize: 24, color: C.text }}>{p.vitals.bp.sys}/{p.vitals.bp.dia} <span style={{ color: C.red, fontSize: 15 }}>↗</span></div>
                <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, marginTop: 4 }}>{p.vitals.bp.delta}</div>
              </Card>
              <Card>
                <SectionLabel>EJECTION FRACTION</SectionLabel>
                <div style={{ fontFamily: head, fontSize: 24, color: C.text }}>{p.vitals.ef.val}</div>
                <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, marginTop: 4 }}>{p.vitals.ef.note}</div>
              </Card>
              <Card>
                <SectionLabel>MEDICATION ADH.</SectionLabel>
                <div style={{ fontFamily: head, fontSize: 24, color: p.adherence.pct < 60 ? C.red : C.mint }}>{p.adherence.pct}%</div>
                <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, marginTop: 4 }}>{p.adherence.source}, last 14d</div>
              </Card>
            </div>
            <SectionLabel>BNP TREND (90d)</SectionLabel>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 18, height: 90, marginBottom: 24, padding: "0 6px" }}>
              {p.bnpSeries.map((pt, i) => {
                const max = Math.max(...p.bnpSeries.map((x) => x.val));
                return (
                  <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                    <div style={{ fontFamily: mono, fontSize: 10.5, color: C.text2 }}>{pt.val}</div>
                    <div style={{ width: 26, height: `${(pt.val / max) * 60}px`, background: `linear-gradient(180deg, ${C.cyan}, ${C.cyan}33)`, borderRadius: 4 }} />
                    <div style={{ fontFamily: mono, fontSize: 10, color: C.text3 }}>{pt.date}</div>
                  </div>
                );
              })}
            </div>
          </>
        ) : (
          <Card><SectionLabel>LAST VISIT NOTES</SectionLabel>
            <div style={{ fontFamily: sans, fontSize: 14, lineHeight: 1.7, color: C.text2 }}>{p.lastVisitNote}</div>
          </Card>
        )}
      </div>

      <div style={{ background: C.bg2, padding: 16, display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 14 }}>
          <span style={{ color: C.mint, fontSize: 13 }}>✦</span>
          <span style={{ fontFamily: mono, fontSize: 11, color: C.mint, letterSpacing: 0.5 }}>AI COPILOT · LIVE</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, flex: 1, overflowY: "auto" }}>
          {p.insights.filter((i) => i.confidence >= 55).slice(0, 3).map((ins) => (
            <Card key={ins.id} hover onClick={() => openReasoning(p.id, ins.id)} style={{ opacity: ins.confidence >= 60 ? 1 : 0.65 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                <span style={{ fontSize: 12, color: ins.type === "critical" ? C.red : ins.type === "trend" ? C.amber : ins.type === "suggestion" ? C.cyan : C.mint }}>
                  {ins.type === "critical" ? "▲" : ins.type === "trend" ? "↗" : ins.type === "suggestion" ? "✦" : "✓"}
                </span>
                <span style={{ fontFamily: mono, fontSize: 10.5, color: C.text2, letterSpacing: 0.4 }}>{ins.headline}</span>
              </div>
              <div style={{ fontFamily: sans, fontSize: 12.5, lineHeight: 1.55, color: C.text, marginBottom: 10 }}>{ins.text}</div>
              <ConfBar value={ins.confidence} />
              <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 4, color: C.text3, fontFamily: sans, fontSize: 11.5 }}>View reasoning ›</div>
            </Card>
          ))}
          {p.insights.filter((i) => i.confidence < 55).length > 0 && (
            <div style={{ fontFamily: mono, fontSize: 10.5, color: C.text3, textAlign: "center", padding: "6px 0" }}>
              {p.insights.filter((i) => i.confidence < 55).length} low-signal insight(s) quarantined
            </div>
          )}
        </div>
        <div style={{ marginTop: 12, borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
          <div style={{ display: "flex", gap: 6 }}>
            <input value={ask} onChange={(e) => setAsk(e.target.value)} placeholder="Ask about this patient"
              style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 7, padding: "8px 10px",
                color: C.text, fontFamily: sans, fontSize: 12.5 }}
              onKeyDown={(e) => { if (e.key === "Enter" && ask.trim()) { setChatDraft(ask.trim()); setAsk(""); setScreen("chat"); } }} />
            <button onClick={() => { if (ask.trim()) { setChatDraft(ask.trim()); setAsk(""); setScreen("chat"); } }}
              style={{ background: C.mint, border: "none", borderRadius: 7, width: 32, display: "flex", alignItems: "center",
                justifyContent: "center", cursor: "pointer", color: "#04140C", fontSize: 14 }}>➤</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* SCREEN 2 — AI CHAT */
function buildAiReply(text, p) {
  const t = text.toLowerCase();
  if (t.includes("bnp")) {
    return { text: `BNP values for ${p.name.split(" ")[0]} over the past 90 days show a progressive increase: ${p.bnpSeries.map((s) => `${s.val} pg/mL (${s.date})`).join(" → ")}. This is clinically significant in the context of ${p.vitals.ef.note.toLowerCase()} EF and declining medication adherence.`,
      sources: ["Lab results " + p.bnpSeries.map((s) => s.date).join(" · "), "Adherence logs (app-verified)"], action: null };
  }
  if (t.includes("diuretic") || t.includes("furosemide") || t.includes("dose")) {
    return { text: `Given the BNP trend, fluid retention signs, and current furosemide dose, an increase may be warranted. However, eGFR has shown mild decline (${p.egfrSeries[0].val} → ${p.egfrSeries[1].val} in 60 days). Suggest checking today's creatinine before adjusting.`,
      sources: ["Renal function — eGFR trend, 60-day window", "Medication log — app-verified"], action: "Pre-populate order" };
  }
  return { text: `Based on ${p.name.split(" ")[0]}'s current record: BP is ${p.vitals.bp.sys}/${p.vitals.bp.dia} (${p.vitals.bp.delta}), medication adherence is ${p.adherence.pct}% over the last 14 days, and EF is ${p.vitals.ef.val}. Let me know if you'd like the reasoning behind any specific insight.`,
    sources: ["Vitals — latest reading", "Medication log — app-verified"], action: null };
}

function ChatScreen({ patients, selectedId, updatePatient, chatDraft, setChatDraft }) {
  const p = patients.find((x) => x.id === selectedId);
  const [input, setInput] = useState("");
  const [expandedEgfr, setExpandedEgfr] = useState({});
  const endRef = useRef(null);

  useEffect(() => { if (chatDraft) { setInput(chatDraft); setChatDraft(""); } }, [chatDraft]);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [p.chat.length]);

  const send = () => {
    if (!input.trim()) return;
    const q = input.trim();
    const reply = buildAiReply(q, p);
    updatePatient(p.id, { chat: [...p.chat, { sender: "doctor", text: q }, { sender: "ai", ...reply, id: Date.now() }] });
    setInput("");
  };

  const allSources = useMemo(() => {
    const s = new Set();
    p.chat.forEach((m) => m.sources?.forEach((x) => s.add(x)));
    return [...s];
  }, [p.chat]);

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 260px", minHeight: "calc(100vh - 53px)", background: C.bg2 }}>
      <div style={{ display: "flex", flexDirection: "column", padding: "18px 24px" }}>
        <div>
          <div style={{ fontFamily: head, fontSize: 18, fontWeight: 700, color: C.text }}>Clinical AI Chat</div>
          <div style={{ fontFamily: mono, fontSize: 11.5, color: C.text3 }}>Grounded in {p.name}'s record · Read-only mode</div>
        </div>
        <div style={{ margin: "12px 0", padding: "8px 12px", background: `${C.amber}0f`, border: `1px solid ${C.amber}33`, borderRadius: 7, fontFamily: sans, fontSize: 11.5, color: C.amber }}>
          All suggestions require physician review. AI does not write final orders.
        </div>
        <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 14, padding: "12px 0" }}>
          {p.chat.length === 0 && (
            <div style={{ fontFamily: sans, fontSize: 13, color: C.text3, textAlign: "center", marginTop: 40 }}>
              Ask a clinical question — try "What's his BNP trend?" or "Should I increase the diuretic dose?"
            </div>
          )}
          {p.chat.map((m, i) => (
            <div key={i} style={{ alignSelf: m.sender === "doctor" ? "flex-end" : "flex-start", maxWidth: "78%" }}>
              {m.sender === "ai" && <div style={{ fontFamily: mono, fontSize: 10.5, color: C.mint, marginBottom: 4 }}>CLINICO AI</div>}
              <div style={{ background: m.sender === "doctor" ? C.surface2 : C.surface, border: `1px solid ${C.border}`, borderRadius: 10,
                padding: "10px 13px", fontFamily: sans, fontSize: 13.5, lineHeight: 1.6, color: C.text }}>
                {m.text}
                {m.sources && (
                  <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${C.border}`, fontFamily: mono, fontSize: 10.5, color: C.text3 }}>
                    Sources: {m.sources.join(" · ")}
                  </div>
                )}
                {m.action && (
                  <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <Btn small variant="secondary">{m.action}</Btn>
                    <Btn small variant="secondary" onClick={() => setExpandedEgfr((e) => ({ ...e, [i]: !e[i] }))}>
                      {expandedEgfr[i] ? "Hide eGFR history" : "Show eGFR history"}
                    </Btn>
                  </div>
                )}
                {expandedEgfr[i] && (
                  <div style={{ marginTop: 10, display: "flex", gap: 16 }}>
                    {p.egfrSeries.map((e, idx) => (
                      <div key={idx} style={{ textAlign: "center" }}>
                        <div style={{ fontFamily: mono, fontSize: 13, color: C.cyan }}>{e.val}</div>
                        <div style={{ fontFamily: mono, fontSize: 10, color: C.text3 }}>{e.date}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          ))}
          <div ref={endRef} />
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()}
            placeholder="Ask a clinical question about this patient..."
            style={{ flex: 1, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "11px 14px", color: C.text, fontFamily: sans, fontSize: 13.5 }} />
          <Btn variant="primary" onClick={send}>Send</Btn>
        </div>
      </div>
      <div style={{ padding: 16, borderLeft: `1px solid ${C.border}` }}>
        <SectionLabel>REFERENCED DATA</SectionLabel>
        {allSources.length === 0 && <div style={{ fontFamily: sans, fontSize: 12, color: C.text3 }}>No sources cited yet.</div>}
        {allSources.map((s, i) => (
          <Card key={i} style={{ marginBottom: 8, padding: 10 }}><div style={{ fontFamily: sans, fontSize: 12, color: C.text }}>{s}</div></Card>
        ))}
      </div>
    </div>
  );
}

/* SCREEN 3 — ALERTS */
function AlertsScreen({ patients, updatePatient, openReasoning, setScreen, setSelectedId }) {
  const [filter, setFilter] = useState("all");
  const allAlerts = patients.flatMap((p) => p.alerts.map((a) => ({ ...a, patient: p })));
  const visible = filter === "all" ? allAlerts : allAlerts.filter((a) => a.severity === filter);
  const activeCount = allAlerts.filter((a) => a.status === "active").length;
  const suppressed = allAlerts.filter((a) => a.status === "snoozed").length;

  const setAlertStatus = (patientId, alertId, status) => {
    const p = patients.find((x) => x.id === patientId);
    updatePatient(patientId, { alerts: p.alerts.map((a) => (a.id === alertId ? { ...a, status } : a)) });
  };

  return (
    <div style={{ padding: "20px 28px", maxWidth: 820, margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontFamily: head, fontSize: 20, fontWeight: 700, color: C.text }}>Clinical Alerts</div>
          <div style={{ fontFamily: mono, fontSize: 11.5, color: C.text3, marginTop: 2 }}>Filtered · {activeCount} active · {suppressed} suppressed today</div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {["all", "critical", "warning", "info"].map((f) => (
            <button key={f} onClick={() => setFilter(f)} style={{ padding: "6px 11px", borderRadius: 7, fontFamily: sans, fontSize: 12,
              fontWeight: 600, cursor: "pointer", background: filter === f ? C.surface2 : "transparent", color: filter === f ? C.text : C.text3,
              border: `1px solid ${filter === f ? C.border2 : C.border}`, textTransform: "capitalize" }}>{f}</button>
          ))}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 20 }}>
        {visible.map((a) => {
          const dim = a.status !== "active";
          return (
            <Card key={a.id} style={{ opacity: dim ? 0.55 : 1 }}>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ width: 8, height: 8, borderRadius: 8, background: sevColor(a.severity), marginTop: 6, flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
                    <div style={{ fontFamily: sans, fontSize: 14, fontWeight: 700, color: C.text }}>{a.title}</div>
                    <div style={{ fontFamily: mono, fontSize: 10.5, color: C.text3 }}>{a.time}</div>
                  </div>
                  <div style={{ fontFamily: sans, fontSize: 13, color: C.text2, lineHeight: 1.55, margin: "6px 0 10px" }}>{a.text}</div>
                  {a.insightId && (
                    <div onClick={() => openReasoning(a.patient.id, a.insightId)} style={{ display: "inline-flex", alignItems: "center", gap: 4,
                      color: C.cyan, fontFamily: sans, fontSize: 12, cursor: "pointer", marginBottom: 10 }}>Why this alert? View reasoning ›</div>
                  )}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {a.status === "active" && a.severity === "critical" && (
                      <>
                        <Btn small variant="secondary" onClick={() => { setSelectedId(a.patient.id); setScreen("dashboard"); }}>Review patient</Btn>
                        <Btn small variant="ghost" onClick={() => setAlertStatus(a.patient.id, a.id, "acknowledged")}>Acknowledge</Btn>
                        <Btn small variant="ghost" onClick={() => setAlertStatus(a.patient.id, a.id, "snoozed")}>Snooze 24h</Btn>
                      </>
                    )}
                    {a.status === "active" && a.severity === "warning" && (
                      <>
                        <Btn small variant="secondary">Assign to nurse</Btn>
                        <Btn small variant="ghost" onClick={() => setAlertStatus(a.patient.id, a.id, "acknowledged")}>Log contact</Btn>
                      </>
                    )}
                    {a.status !== "active" && <Pill color={C.text3}>{a.status === "acknowledged" ? "Acknowledged" : "Snoozed"}</Pill>}
                  </div>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
      <div style={{ marginTop: 24, padding: 14, background: C.bg3, borderRadius: 10, border: `1px solid ${C.border}` }}>
        <div style={{ fontFamily: mono, fontSize: 10.5, color: C.mint, marginBottom: 4 }}>ALERT PHILOSOPHY</div>
        <div style={{ fontFamily: sans, fontSize: 12.5, color: C.text2, lineHeight: 1.6 }}>
          Clinico AI generates ~3 alerts per doctor per day on average. Low-confidence signals are deliberately suppressed — alert fatigue is treated as a system failure, not a user problem.
        </div>
      </div>
    </div>
  );
}

/* SCREEN 5 — REASONING MODAL */
function ReasoningModal({ patients, target, close, updatePatient }) {
  if (!target) return null;
  const p = patients.find((x) => x.id === target.patientId);
  const insight = p.insights.find((i) => i.id === target.insightId);
  if (!insight) return null;
  const r = insight.reasoning;

  const flagIncorrect = () => updatePatient(p.id, { insights: p.insights.map((i) => (i.id === insight.id ? { ...i, status: "flagged" } : i)) });
  const markReviewed = () => updatePatient(p.id, { insights: p.insights.map((i) => (i.id === insight.id ? { ...i, status: "reviewed" } : i)) });

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(5,6,8,0.7)", backdropFilter: "blur(3px)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20 }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.bg2, border: `1px solid ${C.border2}`, borderRadius: 14,
        maxWidth: 560, width: "100%", maxHeight: "85vh", overflowY: "auto", padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
          <div>
            <div style={{ fontFamily: head, fontSize: 18, fontWeight: 700, color: C.text }}>Why did the AI flag this?</div>
            <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, marginTop: 3 }}>{insight.headline} · {p.name}</div>
          </div>
          <button onClick={close} style={{ background: "none", border: "none", cursor: "pointer", color: C.text3, fontSize: 16 }}>✕</button>
        </div>
        {insight.status !== "active" && (
          <Pill color={insight.status === "flagged" ? C.red : C.mint} style={{ marginTop: 10, display: "inline-block" }}>
            {insight.status === "flagged" ? "Flagged as incorrect" : "Marked reviewed"}
          </Pill>
        )}
        <div style={{ margin: "18px 0", padding: 16, background: C.surface, borderRadius: 10, textAlign: "center" }}>
          <div style={{ fontFamily: head, fontSize: 34, fontWeight: 700, color: confColor(insight.confidence) }}>{insight.confidence}%</div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.text2, marginTop: 2 }}>{r.conclusion}</div>
        </div>
        <SectionLabel>HOW THE AI REASONED</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {r.steps.map((s, i) => (
            <div key={i} style={{ display: "flex", gap: 10 }}>
              <div style={{ fontFamily: mono, fontSize: 11, color: C.text3, flexShrink: 0, width: 18 }}>{String(i + 1).padStart(2, "0")}</div>
              <div style={{ fontFamily: sans, fontSize: 13, color: C.text2, lineHeight: 1.55 }}>{s}</div>
            </div>
          ))}
        </div>
        <SectionLabel>CONTRIBUTING SIGNALS</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          {r.signals.map((s, i) => (
            <div key={i}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontFamily: sans, fontSize: 12, color: C.text2 }}>{s.label}</span>
                <span style={{ fontFamily: mono, fontSize: 10.5, color: C.text3 }}>{s.tier} WEIGHT ({s.weight})</span>
              </div>
              <div style={{ height: 4, borderRadius: 4, background: C.surface2 }}>
                <div style={{ height: "100%", borderRadius: 4, width: s.tier === "HIGH" ? "85%" : s.tier === "MED" ? "50%" : "25%",
                  background: s.tier === "HIGH" ? C.mint : s.tier === "MED" ? C.cyan : C.text3 }} />
              </div>
            </div>
          ))}
        </div>
        <div style={{ padding: 12, background: `${C.cyan}0d`, border: `1px solid ${C.cyan}33`, borderRadius: 8, marginBottom: 20 }}>
          <div style={{ fontFamily: mono, fontSize: 10, color: C.cyan, marginBottom: 4 }}>WHAT WOULD LOWER THIS RISK</div>
          <div style={{ fontFamily: sans, fontSize: 12.5, color: C.text2 }}>{r.counterfactual}</div>
        </div>
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", flexWrap: "wrap" }}>
          <Btn variant="danger" onClick={flagIncorrect}>Flag as incorrect</Btn>
          <Btn variant="secondary" onClick={markReviewed}>Mark reviewed</Btn>
          <Btn variant="primary" onClick={close}>Act on this</Btn>
        </div>
      </div>
    </div>
  );
}

/* SCREEN 6 — NOTE GENERATION */
function NoteScreen({ patients, selectedId, updatePatient }) {
  const p = patients.find((x) => x.id === selectedId);
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState("");
  const sections = ["subjective", "objective", "assessment", "plan"];
  const labels = { subjective: "Subjective", objective: "Objective", assessment: "Assessment", plan: "Plan" };
  const locked = p.note.status === "signed";

  const startEdit = (key) => { setEditing(key); setDraft(p.note[key].text); };
  const saveEdit = () => { updatePatient(p.id, { note: { ...p.note, [editing]: { ...p.note[editing], text: draft } } }); setEditing(null); };
  const regenerate = (key) => updatePatient(p.id, { note: { ...p.note, [key]: { ...p.note[key], text: p.note[key].text + " [regenerated]" } } });
  const sign = () => updatePatient(p.id, { note: { ...p.note, status: "signed", signedAt: new Date().toLocaleString() } });

  return (
    <div style={{ padding: "20px 28px", maxWidth: 720, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 8,
        background: locked ? `${C.mint}12` : `${C.violet}12`, border: `1px solid ${locked ? C.mint + "44" : C.violet + "44"}`,
        marginBottom: 18, fontFamily: mono, fontSize: 11.5, color: locked ? C.mint : C.violet }}>
        {locked ? "🔒" : "✦"} {locked ? `SIGNED · Locked · ${p.note.signedAt}` : "DRAFT — AI-generated. Review, edit, and sign before saving."}
      </div>
      <div style={{ fontFamily: head, fontSize: 19, fontWeight: 700, color: C.text, marginBottom: 2 }}>Visit Note — Cardiology</div>
      <div style={{ fontFamily: mono, fontSize: 11.5, color: C.text3, marginBottom: 20 }}>{p.name} · Review required</div>
      {sections.map((key) => (
        <div key={key} style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <SectionLabel>{labels[key].toUpperCase()}</SectionLabel>
            <Pill color={C.text3}>{p.note[key].source}</Pill>
          </div>
          <Card>
            {editing === key ? (
              <>
                <textarea value={draft} onChange={(e) => setDraft(e.target.value)} rows={4} style={{ width: "100%", background: C.bg3,
                  border: `1px solid ${C.border}`, borderRadius: 6, padding: 10, color: C.text, fontFamily: sans, fontSize: 13, lineHeight: 1.6, resize: "vertical" }} />
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <Btn small variant="primary" onClick={saveEdit}>Save section</Btn>
                  <Btn small variant="ghost" onClick={() => setEditing(null)}>Cancel</Btn>
                </div>
              </>
            ) : (
              <>
                <div style={{ fontFamily: sans, fontSize: 13.5, lineHeight: 1.65, color: C.text2, whiteSpace: "pre-line" }}>{p.note[key].text}</div>
                {!locked && (
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <Btn small variant="ghost" onClick={() => startEdit(key)}>✎ Edit</Btn>
                    <Btn small variant="ghost" onClick={() => regenerate(key)}>↻ Regenerate</Btn>
                  </div>
                )}
              </>
            )}
          </Card>
        </div>
      ))}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 10 }}>
        {locked ? <Pill color={C.mint}>Note locked · saved to EHR</Pill> : <Btn variant="primary" onClick={sign}>Sign & Save to EHR</Btn>}
      </div>
      {!locked && <div style={{ fontFamily: sans, fontSize: 11, color: C.text3, textAlign: "right", marginTop: 6 }}>Signing saves to Epic. Patient record updated. Note locks after 24h.</div>}
    </div>
  );
}

        <div style={{ padding: "18px 20px" }}>
          <SectionLabel>YOUR CARE JOURNEY</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {p.timeline.map((e, i) => (
              <div key={i} style={{ display: "flex", gap: 12 }}>
                <div style={{ width: 22, height: 22, borderRadius: 20, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center",
                  background: e.type === "done" ? `${C.mint}22` : e.type === "gap" ? `${C.amber}22` : e.type === "upcoming" ? `${C.cyan}22` : C.surface2,
                  color: e.type === "done" ? C.mint : e.type === "gap" ? C.amber : e.type === "upcoming" ? C.cyan : C.text3, fontFamily: mono, fontSize: 11 }}>
                  {e.type === "done" ? "✓" : e.type === "gap" ? "!" : e.type === "upcoming" ? "→" : ""}
                </div>
                <div>
                  <div style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, color: C.text }}>{e.label}</div>
                  <div style={{ fontFamily: mono, fontSize: 10.5, color: C.text3 }}>{e.date} · {e.sub}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ padding: "6px 20px 22px" }}>
          <SectionLabel>TODAY'S CHECKLIST</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {p.checklist.map((c) => (
              <div key={c.id} onClick={() => toggleCheck(c.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px",
                borderRadius: 10, background: C.surface, border: `1px solid ${C.border}`, cursor: "pointer" }}>
                <div style={{ width: 18, height: 18, borderRadius: 5, border: `1.5px solid ${c.done ? C.mint : C.text3}`,
                  background: c.done ? C.mint : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "#04140C", fontSize: 11 }}>
                  {c.done && "✓"}
                </div>
                <div style={{ fontFamily: sans, fontSize: 13, color: c.done ? C.text3 : C.text, textDecoration: c.done ? "line-through" : "none" }}>{c.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ROOT APP */
function ClinicoAIPrototype() {
  const [patients, setPatients] = useState(initialPatients());
  const [role, setRole] = useState("doctor");
  const [selectedId, setSelectedId] = useState("rajan");
  const [screen, setScreen] = useState("dashboard");
  const [reasoningTarget, setReasoningTarget] = useState(null);
  const [chatDraft, setChatDraft] = useState("");

  const updatePatient = (id, patch) => setPatients((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const openReasoning = (patientId, insightId) => setReasoningTarget({ patientId, insightId });
  const alertCount = patients.flatMap((p) => p.alerts).filter((a) => a.status === "active").length;

  return (
    <div style={{ fontFamily: sans, background: C.bg, minHeight: "100vh", color: C.text }}>
      <TopNav role={role} setRole={setRole} screen={screen} setScreen={setScreen} alertCount={alertCount} />
      {role === "doctor" ? (
        <>
          {screen === "dashboard" && <Dashboard patients={patients} selectedId={selectedId} setSelectedId={setSelectedId} openReasoning={openReasoning} setScreen={setScreen} setChatDraft={setChatDraft} />}
          {screen === "chat" && <ChatScreen patients={patients} selectedId={selectedId} updatePatient={updatePatient} chatDraft={chatDraft} setChatDraft={setChatDraft} />}
          {screen === "alerts" && <AlertsScreen patients={patients} updatePatient={updatePatient} openReasoning={openReasoning} setScreen={setScreen} setSelectedId={setSelectedId} />}
          {screen === "note" && <NoteScreen patients={patients} selectedId={selectedId} updatePatient={updatePatient} />}
        </>
      ) : (
        <PatientScreen patients={patients} selectedId={selectedId} setSelectedId={setSelectedId} updatePatient={updatePatient} />
      )}
      <ReasoningModal patients={patients} target={reasoningTarget} close={() => setReasoningTarget(null)} updatePatient={updatePatient} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ClinicoAIPrototype />);
</script>
</body>
</html>
